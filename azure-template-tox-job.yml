# File: azure-template-tox-job.yml
# Date: 8-Jul-2019 jdw split out from original pipeline
# Supports: fixtures=mmseqs2,mongodb (linux, macos)
#
# Updates:
#  6-Aug-2019  jdw build source and binary wheels by default.
# 13-Aug-2019  jdw export config support token prior to launching tox runner
#  9-Sep-2019  jdw set unlimited timeout
# 22-Sep-2026  dwp install MongoDB on macOS from official tarball (Homebrew 6 dropped Intel bottles)
#
##
parameters:
  tox: ""
  python: ""
  os: "linux"
  fixtures: ""

jobs:
  - job: ${{ format('build_test_{0}_{1}', parameters.tox, parameters.os) }}
    pool:
      ${{ if eq(parameters.os, 'macos') }}:
        vmImage: "macOS-15"
      ${{ if eq(parameters.os, 'linux') }}:
        vmImage: "ubuntu-latest"

    variables:
      - group: py-shared-variables

    steps:
      #
      # ensure the required Python versions are available
      - task: UsePythonVersion@0
        inputs:
          versionSpec: ${{ parameters.python }}
          addToPath: true
        displayName: setup python
      #
      - checkout: self
        submodules: true
        fetchDepth: 1
      #
      - ${{ if startsWith(parameters.os, 'macos') }}:
          - bash: |
              set -e
              ls -la /Applications/Xcode*
              sudo xcode-select --switch /Applications/Xcode_16.app/Contents/Developer
              which g++
              c++ --version
            displayName: "setup Xcode"
          #
          - script: which brew
            displayName: "Check package manager"
          - script: brew install flex
            displayName: "Install flex"
          - script: which flex
            displayName: "Check flex"
          - script: brew install bison
            displayName: "Install bison"
          - script: which bison
            displayName: "Check bison"
          #
          - script: brew install mmseqs2
            displayName: 'Install mmseqs2'
          - script: which mmseqs
            displayName: 'Check mmseqs2'
          #
          - script: brew install mariadb
            displayName: 'Install mariadb'
      # ----------------------------------------------
      - ${{ if startsWith(parameters.os, 'linux') }}:
          - script: which apt
            displayName: "Installing OS dependencies"
          - script: apt-cache policy | grep http | awk '{print $2 $3}' | sort -u
            displayName: "Checking for repos"
          - script: sudo apt-get update
            displayName: 'update apt'
          - script: sudo apt-get install flex
            displayName: "Install flex"
          - script: sudo apt-get install bison
            displayName: "Install bison"
    #
      - ${{ if and(contains(parameters.fixtures, 'mmseqs2'), startsWith(parameters.os, 'linux')) }}:
        - bash: |
            [ $(uname -m) = "x86_64" ] && echo "64bit: Yes" || echo "64bit: No"
            grep -q sse4_1 /proc/cpuinfo && echo "SSE4.1: Yes" || echo "SSE4.1: No"
            grep -q avx2 /proc/cpuinfo && echo "AVX2: Yes" || echo "AVX2: No"
          displayName: 'Check architecture'
        - bash: |
            echo "Downloading latest MMseqs2 static build"
            attempt=1
            while [[ $attempt -le 5 ]]; do
                wget https://mmseqs.com/latest/mmseqs-linux-avx2.tar.gz
                if [[ $? -eq 0 ]]; then
                    echo "Download successful."
                    break
                else
                    echo "Download failed. Retrying in 5 seconds..."
                    sleep 5
                    attempt=$((attempt + 1))
                fi
            done
            tar xvzf mmseqs-linux-avx2.tar.gz
            sudo cp mmseqs/bin/mmseqs /usr/local/bin/mmseqs
          displayName: 'Install mmseqs2 binary'
      #
      - ? ${{ if and(contains(parameters.fixtures, 'mongodb'), startsWith(parameters.os, 'linux')) }}
        : # Mongo install
          - script: |
              sudo apt-get install gnupg curl
              curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | sudo gpg -o /usr/share/keyrings/mongodb-server-8.0.gpg --dearmor
              sudo apt list --installed | grep mongodb
              echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
              sudo apt-get update
              sudo apt-get install -y mongodb-org
              sudo apt list --installed | grep mongo
            displayName: "Installing mongodb"
          #
          - script: |
              sudo service mongod start
              sudo ss -tulpn
            displayName: "Start Mongo service"
        #
      - ${{ if and(contains(parameters.fixtures, 'mongodb'), startsWith(parameters.os, 'macos')) }}:
          # Homebrew 6.0 no longer provides bottles for Intel (x86_64) macOS, so `brew install mongodb-community`
          # now compiles its dependencies (openssl@3, node, ...) from source and exceeds the job timeout.
          # Install MongoDB's official prebuilt macOS tarball instead (the same artifact the mongodb/brew formula uses).
          - bash: |
              set -euo pipefail
              MONGO_SERIES="8.0"
              MONGO_FALLBACK_VERSION="8.0.28"
              case "$(uname -m)" in
                x86_64) MONGO_ARCH="x86_64" ;;
                arm64)  MONGO_ARCH="arm64" ;;
                *) echo "Unsupported architecture: $(uname -m)"; exit 1 ;;
              esac
              # Resolve the latest production release in the series, falling back to a pinned version
              MONGO_VERSION=$(curl -fsSL --retry 3 https://downloads.mongodb.org/full.json | python -c '
              import json, sys
              series, arch = sys.argv[1], sys.argv[2]
              vL = []
              for v in json.load(sys.stdin).get("versions", []):
                  if not (v.get("production_release") and v.get("version", "").startswith(series + ".")):
                      continue
                  if any(d.get("target") == "macos" and d.get("arch") == arch for d in v.get("downloads", [])):
                      vL.append(v["version"])
              print(max(vL, key=lambda x: tuple(int(p) for p in x.split("."))) if vL else "")
              ' "$MONGO_SERIES" "$MONGO_ARCH") || MONGO_VERSION=""
              MONGO_VERSION="${MONGO_VERSION:-$MONGO_FALLBACK_VERSION}"
              MONGO_URL="https://fastdl.mongodb.org/osx/mongodb-macos-${MONGO_ARCH}-${MONGO_VERSION}.tgz"
              echo "Downloading ${MONGO_URL}"
              curl -fsSL --retry 5 --retry-delay 5 -o "$(Agent.TempDirectory)/mongodb.tgz" "$MONGO_URL"
              MONGO_HOME="$(Agent.ToolsDirectory)/mongodb"
              mkdir -p "$MONGO_HOME"
              tar -xzf "$(Agent.TempDirectory)/mongodb.tgz" -C "$MONGO_HOME" --strip-components 1
              "$MONGO_HOME/bin/mongod" --version
              echo "##vso[task.prependpath]$MONGO_HOME/bin"
            displayName: "Installing mongodb"
          #
          - bash: |
              set -euo pipefail
              MONGO_DATA="$(Agent.TempDirectory)/mongodb-data"
              mkdir -p "$MONGO_DATA/db"
              mongod --dbpath "$MONGO_DATA/db" --logpath "$MONGO_DATA/mongod.log" --bind_ip 127.0.0.1 --port 27017 --fork
            displayName: "Start Mongo service"
          #
          - bash: |
              for i in $(seq 1 30); do
                if nc -z 127.0.0.1 27017; then echo "mongod is listening on port 27017"; exit 0; fi
                sleep 2
              done
              echo "mongod is not listening on port 27017"
              tail -n 100 "$(Agent.TempDirectory)/mongodb-data/mongod.log" || true
              exit 1
            displayName: "Check mongodb service"
        #
      #
      - script: 'python -c "import sys; print(sys.version); print(sys.executable)"'
        displayName: show python information
      #
      - script: python -m pip install --upgrade pip tox
        displayName: "Install tools"
        #
      - script: pip install .[tests]
        displayName: "Install dependencies"
      #
      - ${{ if startsWith(parameters.tox, 'py') }}:
          - script: |
              export CONFIG_SUPPORT_TOKEN_ENV=$(VAR_CONFIG_SUPPORT_TOKEN_ENV)
              ${{ format('python -m tox -e {0}', parameters.tox) }}
            displayName: "Running tox task"
      - ? ${{ if and(not(startsWith(parameters.tox, 'py')), startsWith(parameters.python, '3.13')) }}
        : - script: |
              export CONFIG_SUPPORT_TOKEN_ENV=$(VAR_CONFIG_SUPPORT_TOKEN_ENV)
              ${{ format('python -m tox -e {0}-py313', parameters.tox) }}
            displayName: "Running tox task"
      #
      #  Build artifacts if this is a test target (i.e. labeled as py##)
      #
      - ${{ if startsWith(parameters.tox, 'py') }}:
          - script: pip install --upgrade pip build twine hatch
            displayName: "Acquire build tools"
          - script: python -m build --sdist --wheel --outdir "$(System.DefaultWorkingDirectory)/dist"
            displayName: "Build source and wheel distributions"
          #
          # Check the install artifacts
          - script: ls -lR "$(System.DefaultWorkingDirectory)/dist"
            displayName: "Listing of installed software"
          #
          - publish: $(System.DefaultWorkingDirectory)/dist
            artifact: ${{ format('sw_{0}_{1}', parameters.tox, parameters.os) }}
        #
